<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Carte de visite | CSS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --or:#F1A849; --noir:#000000; --blanc:#FFFFFF;
    --texte:#000000; --doux:#6B6B6B; --ligne:#ECECEC; --fond:#F6F6F6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--fond)}
  body{font-family:'Urbanist',system-ui,sans-serif;color:var(--texte);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;justify-content:center}
  .carte{width:100%;max-width:440px;background:var(--blanc);min-height:100vh;position:relative;overflow:hidden}
  @media (min-width:480px){ body{padding:32px 0} .carte{min-height:auto;border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.08)} }

  /* En-tete noir */
  .entete{background:var(--noir);height:200px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:34px}
  .entete::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--or)}
  .logo{height:54px;max-width:260px;object-fit:contain}
  .avec-logo .raison{display:none}
  .avec-logo{padding-top:42px}
  .sigle{display:none;font-weight:800;font-size:34px;letter-spacing:6px;color:var(--blanc)}
  .sigle span{color:var(--or)}
  .raison{margin-top:8px;font-size:11px;letter-spacing:2.4px;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:600}

  /* Identite */
  .photo{width:132px;height:132px;border-radius:50%;margin:-66px auto 0;position:relative;z-index:2;border:5px solid var(--blanc);background:var(--noir);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 2px var(--or)}
  .photo img{width:100%;height:100%;object-fit:cover}
  .initiales{color:var(--or);font-weight:800;font-size:42px;letter-spacing:2px}
  .identite{text-align:center;padding:18px 28px 0}
  .nom{font-size:26px;font-weight:800;line-height:1.15;letter-spacing:-.2px}
  .poste{margin-top:6px;font-size:15px;font-weight:600;color:var(--or);text-transform:uppercase;letter-spacing:1.6px}
  .bureau{margin-top:8px;font-size:14px;color:var(--doux);font-weight:500;display:inline-flex;align-items:center;gap:6px}
  .bureau svg{width:15px;height:15px}

  /* Actions 2 x 2 */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:26px 28px 0}
  .action{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:92px;border-radius:18px;background:var(--fond);color:var(--texte);text-decoration:none;font-weight:700;font-size:14px;transition:transform .15s, background .15s}
  .action:active{transform:scale(.97)}
  .action:hover{background:#EFEFEF}
  .action .ic{width:40px;height:40px;border-radius:50%;background:var(--noir);display:flex;align-items:center;justify-content:center}
  .action svg{width:19px;height:19px;stroke:var(--or)}
  .action.off{opacity:.35;pointer-events:none}

  /* Boutons principaux */
  .boutons{padding:14px 28px 0;display:grid;gap:12px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:16px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;border:0;text-decoration:none;transition:transform .15s}
  .btn:active{transform:scale(.98)}
  .btn svg{width:20px;height:20px}
  .btn.principal{background:var(--or);color:var(--noir)}
  .btn.principal svg{stroke:var(--noir)}
  .btn.second{background:var(--blanc);color:var(--noir);border:2px solid var(--noir)}
  .btn.second svg{stroke:var(--noir)}

  /* Coordonnees */
  .infos{margin:26px 28px 0;border-top:1px solid var(--ligne)}
  .info{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--ligne);text-decoration:none;color:inherit}
  .info .ic{flex:0 0 36px;height:36px;border-radius:10px;background:var(--fond);display:flex;align-items:center;justify-content:center}
  .info svg{width:17px;height:17px;stroke:var(--noir)}
  .info small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--doux);font-weight:700}
  .info b{display:block;font-size:15px;font-weight:600;margin-top:2px;word-break:break-word}

  .pied{text-align:center;padding:28px 28px 34px}
  .pied b{display:block;font-size:13px;font-weight:700}
  .pied a{display:inline-block;margin-top:4px;font-size:13px;color:var(--doux);text-decoration:none;font-weight:600}
  .pied .barre{width:36px;height:3px;background:var(--or);border-radius:2px;margin:0 auto 14px}

  .vide{padding:80px 28px;text-align:center}
  .vide h1{font-size:22px;font-weight:800}
  .vide p{margin-top:8px;color:var(--doux)}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--noir);color:var(--blanc);padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<main class="carte" id="carte"></main>
<div class="toast" id="toast">Lien copié</div>

<script src="equipe.js"></script>
<script>
const I = {
  tel:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.7-4.9A8.5 8.5 0 1 1 8 19.6z"/><path d="M9 10c0 3 2 5 5 5l1.2-1.2-2-1-1 .7c-.8-.4-1.4-1-1.8-1.8l.7-1-1-2z"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 6L2 7"/></svg>',
  web:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  save:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>'
};

const E = ENTREPRISE;
const id = (new URLSearchParams(location.search).get('p') || '').toLowerCase().trim();
const P = EQUIPE.find(x => x.id === id);
const racine = document.getElementById('carte');
const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initiales = n => { const m = n.trim().split(/\s+/); return (m[0][0] + (m.length > 1 ? m[m.length-1][0] : '')).toUpperCase(); };

const entete = `
  <header class="entete">
    <img class="logo" src="${esc(E.logo)}" alt="${esc(E.sigle)}" onload="this.parentNode.classList.add('avec-logo')" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
    <div class="sigle">C<span>S</span>S</div>
    <div class="raison">${esc(E.nom)}</div>
  </header>`;

if (!P) {
  document.title = E.nom;
  racine.innerHTML = entete + `<div class="vide"><h1>Carte introuvable</h1><p>Ce lien ne correspond à aucune carte.</p>
    <div class="boutons" style="padding:26px 0 0"><a class="btn principal" href="${esc(E.site)}">${I.web} Visiter ${esc(E.siteAffiche)}</a></div></div>`;
} else {
  document.title = P.nom + ' | ' + E.sigle;
  const tel = (P.telephone||'').replace(/[^\d+]/g,'');
  const act = (ok, href, ic, txt, ext) => `<a class="action${ok?'':' off'}" href="${ok?esc(href):'#'}"${ext?' target="_blank" rel="noopener"':''}><span class="ic">${ic}</span>${txt}</a>`;
  const ligne = (ok, href, ic, label, val) => !ok ? '' : `<a class="info" ${href?`href="${esc(href)}" target="_blank" rel="noopener"`:''}><span class="ic">${ic}</span><span><small>${label}</small><b>${esc(val)}</b></span></a>`;

  racine.innerHTML = entete + `
    <div class="photo">${P.photo ? `<img src="${esc(P.photo)}" alt="${esc(P.nom)}" referrerpolicy="no-referrer">` : `<span class="initiales">${esc(initiales(P.nom))}</span>`}</div>
    <section class="identite">
      <h1 class="nom">${esc(P.nom)}</h1>
      <div class="poste">${esc(P.poste)}</div>
      ${P.bureau ? `<div class="bureau">${I.pin}${esc(P.bureau)}</div>` : ''}
    </section>
    <nav class="actions">
      ${act(tel, 'tel:'+tel, I.tel, 'Appeler')}
      ${act(P.whatsapp, 'https://wa.me/'+P.whatsapp, I.wa, 'WhatsApp', true)}
      ${act(P.email, 'mailto:'+P.email, I.mail, 'Email')}
      ${act(true, E.site, I.web, 'Site web', true)}
    </nav>
    <div class="boutons">
      <button class="btn principal" id="enregistrer">${I.save} Enregistrer le contact</button>
      <button class="btn second" id="partager">${I.share} Partager la carte</button>
    </div>
    <div class="infos">
      ${ligne(P.telephone, 'tel:'+tel, I.tel, 'Téléphone', P.telephone)}
      ${ligne(P.email, 'mailto:'+P.email, I.mail, 'Email', P.email)}
      ${ligne(E.siege, E.carte, I.home, 'Siège social', E.siege)}
    </div>
    <footer class="pied"><div class="barre"></div><b>${esc(E.nom)} ${esc(E.forme)}</b><a href="${esc(E.site)}" target="_blank" rel="noopener">${esc(E.siteAffiche)}</a></footer>`;

  // vCard
  const v = s => String(s||'').replace(/([,;\\])/g,'\\$1');
  document.getElementById('enregistrer').onclick = () => {
    const vcf = ['BEGIN:VCARD','VERSION:3.0',
      'N:'+v(P.nom)+';;;;','FN:'+v(P.nom),
      'ORG:'+v(E.nom),'TITLE:'+v(P.poste),
      tel ? 'TEL;TYPE=CELL,VOICE:'+tel : '',
      E.telephone ? 'TEL;TYPE=WORK,VOICE:'+E.telephone.replace(/[^\d+]/g,'') : '',
      P.email ? 'EMAIL;TYPE=WORK:'+P.email : '',
      'URL:'+E.site,
      'ADR;TYPE=WORK:;;'+v(E.siege)+';;;;',
      'NOTE:'+v('Bureau : '+(P.bureau||'')),
      'END:VCARD'].filter(Boolean).join('\r\n');
    const blob = new Blob([vcf], {type:'text/vcard;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = P.id + '.vcf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };

  // Partage
  document.getElementById('partager').onclick = async () => {
    const data = {title: P.nom + ' | ' + E.sigle, text: P.nom + ', ' + P.poste + ' chez ' + E.nom, url: location.href};
    if (navigator.share) { try { await navigator.share(data); } catch(e){} return; }
    try { await navigator.clipboard.writeText(location.href); } catch(e){}
    const t = document.getElementById('toast'); t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800);
  };
}
</script>
</body>
</html>
